[workspace]
resolver = "2"
# Keep patched pipeline dependencies on the engine's feature set; do not enable optional PBR processors.
exclude = ["vendor/bevy_pbr-0.19.0", "vendor/bevy_core_pipeline-0.19.0"]
members = [
    "crates/converter",
    "crates/dummy-content",
    "crates/engine",
    "crates/launcher",
    "crates/mo2",
    "crates/meshopt-cluster",
    "crates/shared",
    "vendor/bevy_render-0.19.0",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mudcrab Team"]

[workspace.dependencies]
# Engine & Rendering
# Preserve Bevy's default capabilities while replacing its vulnerable Rust Zstd decoder.
# Recheck this feature expansion when upgrading Bevy.
bevy = { version = "0.19.0", default-features = false, features = [
    "2d", "ui", "audio",
    "common_api", "bevy_light", "bevy_mikktspace", "ktx2",
    "morph_animation", "morph", "smaa_luts", "tonemapping_luts",
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render", "bevy_anti_alias",
    "bevy_gltf", "bevy_pbr", "bevy_post_process", "gltf_animation",
    "basis-universal", "pbr_specular_textures", "jpeg", "zstd_c",
] }

# Scripting & Database
mlua = { version = "0.10", features = ["luau", "luau-jit", "vendored"] }
rusqlite = { version = "0.32", features = ["bundled-full"] }
rkyv = { version = "0.8.18" }
memmap2 = "0.9"
crossbeam-channel = "0.5.16"

# Error Handling
color-eyre = "0.6.5"

# Converter Dependencies
mesh-tools = "0.4.0"
basis-universal = "0.3"
ddsfile = "0.5"
nom = "8.0.0"
nom-derive = "0.10.1"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
walkdir = "2.5"
lz4_flex = "0.11"
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
ktx2 = "0.5"
project-wormhole-nif = { path = "vendor/project-wormhole-nif" }
project-wormhole-esm = "0.1.0"

# Mudcrab Plus (portal branch only): bevy_render 0.19.0 vendored for the parallel command-encoder finish
# (impl-1132, analysis-1131). See vendor/bevy_render-0.19.0/MUDCRAB-README.md. Remove this line and the
# folder to go back to the crates.io crate.
[patch.crates-io]
bevy_render = { path = "vendor/bevy_render-0.19.0" }
# Shadow pass diagnostics; see vendor/bevy_pbr-0.19.0/MUDCRAB-README.md.
bevy_pbr = { path = "vendor/bevy_pbr-0.19.0" }
# Native same-frame attachment parity uses the production pass emitters.
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline-0.19.0" }

# Workspace profile optimization
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Keep the vendored renderer's existing dependency optimization after making its tests runnable.
[profile.dev.package.bevy_render]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# A release build for walking a tour, and for nothing else: the same optimised code without the
# link-time pass `release` pays for.
#
# `release` above is the profile everything measured or published uses - acceptance, profiling,
# benchmarks, sign-off. This one is a development convenience, and its frames are not comparable
# with the accepted build's (LTO off changes the frame rate, and the tour's capture density comes
# from the frame rate). Build it with `cargo build --profile release-fast -p engine`; it lands in
# `target/release-fast/`. See docs/demo/README.md, section 4.1.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
# Rebuilds recompile only what changed (Phase 2 Dev's websearch-544: most of a release rebuild is
# the LTO link, which this profile already skips).
incremental = true

# Optimised builds for trying changes, not for measuring them: release without link-time
# optimisation and with the incremental cache, so a one-file edit relinks in well under a
# minute instead of several. Frame times are not comparable with `release`; benchmarks and
# acceptance runs keep `--release`. Usage: `cargo build --profile quick --bin engine`.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.test]
opt-level = 1
debug = 0

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
