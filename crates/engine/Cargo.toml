[package]
name = "engine"
version.workspace = true
edition.workspace = true

[features]
# Serve the Bevy Remote Protocol on 127.0.0.1 when the engine runs with
# `--remote`. Local development only: the endpoint has no authentication.
remote = ["bevy/bevy_remote"]

[dependencies]
shared = { path = "../shared" }
bevy.workspace = true
mlua.workspace = true
rusqlite.workspace = true
rkyv.workspace = true
memmap2.workspace = true
color-eyre.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.20"
