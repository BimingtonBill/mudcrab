[package]
name = "engine"
version.workspace = true
edition.workspace = true

[features]
# Serve the Bevy Remote Protocol on 127.0.0.1 when the engine runs with
# `--remote`. Local development only: the endpoint has no authentication.
remote = ["bevy/bevy_remote"]

[dependencies]
shared = { path = "../shared" }
bevy.workspace = true
bevy_rapier3d = { version = "0.36.0", default-features = false, features = ["dim3", "debug-render-3d"] }
mlua.workspace = true
rusqlite.workspace = true
rkyv.workspace = true
memmap2.workspace = true
color-eyre.workspace = true
# Only for the `--render-backends vulkan` pre-check (render_backend.rs); the version and features Bevy already
# unifies, so nothing new is compiled.
wgpu = { version = "29.0.4", default-features = false }
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.20"
converter = { path = "../converter" }
ddsfile = "0.5"
ktx2.workspace = true
# Composes `shaders/water.wgsl` against stub Bevy modules in a test, the way Bevy's pipeline cache
# composes it, to validate the screen-space reflection's shader code without a GPU. Already in the
# lock file through `bevy_shader`, at the version and features Bevy uses.
naga_oil = { version = "0.22", default-features = false, features = ["test_shader"] }
