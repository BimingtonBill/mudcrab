[package]
name = "engine"
version.workspace = true
edition.workspace = true

[features]
# Serve the Bevy Remote Protocol on 127.0.0.1 when the engine runs with
# `--remote`. Local development only: the endpoint has no authentication.
remote = ["bevy/bevy_remote"]
# Tracy spans for the main and render threads (`bevy/trace_tracy`), for render-thread CPU work:
# `python tools/perf/perf_capture.py run tracy`. A profiling run is a TEST run. Build with
# `--features tracy`; leave it off otherwise (it grows memory with no viewer attached).
# `dep:profiling` with `profile-with-tracing` forwards wgpu-core's own scopes (command encoder finish,
# barrier insertion, submit) to the same Tracy capture.
tracy = ["bevy/trace_tracy", "dep:profiling", "profiling/profile-with-tracing"]
# A RenderDoc capture of a chosen frame (`MUDCRAB_RENDERDOC_CAPTURE_FRAME=<n>`), for settled scenes:
# `python tools/perf/perf_capture.py run renderdoc`. Development only; the engine must run under RenderDoc.
renderdoc = ["dep:renderdoc"]

[dependencies]
shared = { path = "../shared" }
renderdoc = { version = "0.12.1", optional = true }
profiling = { version = "1.0.18", optional = true, default-features = false }
bevy.workspace = true
gltf = { version = "1.4", default-features = false }
bevy_rapier3d = { version = "0.36.0", default-features = false, features = ["dim3", "debug-render-3d"] }
mlua.workspace = true
rusqlite.workspace = true
rkyv.workspace = true
memmap2.workspace = true
color-eyre.workspace = true
# The `--render-backends vulkan` pre-check (render_backend.rs) and the adapter-aware renderer init
# (renderer_init.rs) use wgpu directly; pinned to the version and features Bevy already unifies, so
# nothing new is compiled.
wgpu = { version = "=29.0.4", default-features = false }
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Reuse Bevy's locked dependency to borrow serialized u32 upload bytes without
# copying a whole world on the render thread (native little-endian targets).
bytemuck = { version = "=1.25.0", features = ["derive"] }
ktx2.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
regex = "1.12"
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
zip = { version = "9", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[dev-dependencies]
dummy-content = { path = "../dummy-content" }
tempfile = "3.20"
converter = { path = "../converter", features = ["test-support"] }
ddsfile = "0.5"
ktx2.workspace = true
# Composes `shaders/water.wgsl` against stub Bevy modules in a test, the way Bevy's pipeline cache
# composes it, to validate the screen-space reflection's shader code without a GPU. Already in the
# lock file through `bevy_shader`, at the version and features Bevy uses.
naga_oil = { version = "0.22", default-features = false, features = ["test_shader"] }
