[package]
name = "converter"
version.workspace = true
edition.workspace = true

[features]
# `converter::test_support`: a small synthetic complete base conversion, so another crate's tests (the engine's
# producer/consumer proof) can run the real `derive_extensions::run` on it. Test-only; off by default.
test-support = []

[dependencies]
shared = { path = "../shared" }
mo2 = { path = "../mo2" }
meshopt-cluster = { path = "../meshopt-cluster" }
mesh-tools.workspace = true
basis-universal.workspace = true
ddsfile.workspace = true
nom.workspace = true
nom-derive.workspace = true
rusqlite.workspace = true
rkyv.workspace = true
color-eyre.workspace = true
memmap2 = "0.9.11"
flate2   = "1.1.9"
rayon = "1.12.0"
crossbeam-channel.workspace = true
# `signal` is for the Ctrl+C handler the command-line converter installs, `time` for the timer
# that redraws the status line while one asset is being converted.
tokio = { workspace = true, features = ["signal", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
walkdir.workspace = true
same-file = "1.0"
lz4_flex.workspace = true
image_dds.workspace = true
intel_tex_2 = "0.2.2"
ktx2.workspace = true
project-wormhole-nif.workspace = true
project-wormhole-shared = "0.1.0"
project-wormhole-esm.workspace = true
mlua.workspace = true
zstd = "0.13"
ruzstd = "0.9.1"
# The encoder runs on native Vulkan, Metal or DX12 only (no GL, no WebGPU).
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
tempfile = "3.20"
# Reads converted GLB primitives for the cluster LOD stage (the tests already use it).
gltf = { version = "1.4", default-features = false, features = ["utils", "extras", "extensions"] }

[target.'cfg(all(target_arch = "aarch64", target_family = "unix"))'.dependencies]
# sha2's AArch64 hardware backend is gated by its asm feature.
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
insta = { version = "1.48", features = ["json", "redactions"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
dummy-content = { path = "../dummy-content" }
project-wormhole-shared = "0.1.0"

[build-dependencies]
cc = "1.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
